<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Sign up</title>
        
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
     
        <link rel="stylesheet" type="text/css" href="signup.css">
        
    </head>
    <body>
        <div id="content-container">
            <div id="form-container">
                <div id="form-header-container">
                    <h2 id="form-header"> Registration  </h2>
                </div>

                <div id="form-content-container">
                    <div id="form-content-inner-container">
                        <input type="text" id="signup-username" placeholder="Full name">
                        <input type="email" id="signup-email" placeholder="Email">
                        <input type="password" id="signup-password" placeholder="Password">

                       <div id="button-container">
                            <button onclick="Register()" id="register-button">Register</button>


                   </div>
                        <p id="already-account-text"><a href="login.html">Already have an account?</a></p>
                        
                    

                    </div>
                </div>
            </div>
        </div>
    </body>

<script>
        const firebaseConfig = {
    apiKey: "AIzaSyAR4yovLewStBOsQgp4MTBOr_Erhp6TbeI",
    authDomain: "sign-ip-5d29a.firebaseapp.com",
    projectId: "sign-ip-5d29a",
    storageBucket: "sign-ip-5d29a.appspot.com",
    messagingSenderId: "997289414831",
    appId: "1:997289414831:web:4ca3e6fca101749cdb845a",
    measurementId: "G-KDV3SDCDLN"

};

firebase.initializeApp(firebaseConfig);

        function Register() {
            const username = document.getElementById("signup-username").value;
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;

            firebase.auth().createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                   
                    const user = userCredential.user;
                    console.log("User registered:", user);
                    alert("User registered:", user);
                    window.location.href="home_page1.html"
                })
                .catch((error) =>  {
                    
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    console.error("Registration error:", errorCode, errorMessage);

                });
        }
</script>
   
   

</html>
